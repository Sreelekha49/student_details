<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #F3E8FF; /* Light lavender */
            color: #2E1065;
            padding: 30px 18px;
        }

        header {
            text-align: center;
            margin-bottom: 22px;
        }

        h1 {
            color: #6B21A8; /* Purple */
            margin-bottom: 18px;
            font-size: clamp(1.7rem, 4vw, 2.3rem);
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px auto;
            max-width: 1000px;
        }

        nav a {
            display: inline-block;
            text-decoration: none;
            color: #FFFFFF;
            background: #7E22CE;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            background: #581C87;
            transform: translateY(-1px);
        }

        main {
            width: 100%;
            max-width: 520px;
            margin: 35px auto;
            padding: 30px;
            background: #FFFFFF;
            border: 1px solid #E9D5FF;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(88, 28, 135, 0.12);
        }

        h2 {
            color: #6B21A8;
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .description {
            color: #6B7280;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 9px;
            color: #4C1D95;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #C4B5FD;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: #FAF5FF;
            color: #2E1065;
        }

        input[type="number"]:focus {
            border-color: #7E22CE;
            box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.15);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .delete-btn {
            flex: 1;
            color: #FFFFFF;
            background: #7E22CE;
        }

        .delete-btn:hover {
            background: #581C87;
        }

        .home-btn {
            flex: 1;
            color: #6B21A8;
            background: #E9D5FF;
        }

        .home-btn:hover {
            background: #D8B4FE;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            main {
                padding: 22px 18px;
            }

            nav a {
                font-size: 0.88rem;
                padding: 9px 11px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>School Management System</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="list.html">List Students</a>
            <a href="listOne.html">Find Student</a>
            <a href="insert.html">Add Student</a>
            <a href="update.html">Update Student</a>
            <a href="delete.html">Delete Student</a>
        </nav>
    </header>

    <main>
        <h2>Delete Student</h2>
        <p class="description">Enter the student number you want to delete.</p>

        <form id="deleteForm">
            <label for="sno">Student Number</label>
            <input type="number" id="sno" min="1" required placeholder="Enter student number">

            <div class="actions">
                <button type="submit" class="delete-btn">Delete Student</button>
                <button type="button" class="home-btn" onclick="location.href='index.html'">Home Page</button>
            </div>
        </form>
    </main>

    <script>
        document.getElementById("deleteForm").addEventListener("submit", function (event) {
            event.preventDefault();
            deleteStudent();
        });

        function deleteStudent() {
            const sno = document.getElementById("sno").value.trim();

            if (!sno) {
                alert("Please enter a student number.");
                return;
            }

            if (!confirm("Are you sure you want to delete this student?")) {
                return;
            }

            fetch("/students/" + encodeURIComponent(sno), {
                method: "DELETE"
            })
            .then(async response => {
                const message = await response.text();

                if (!response.ok) {
                    throw new Error(message || "Unable to delete student.");
                }

                return message;
            })
            .then(message => {
                alert(message);
                location.href = "index.html";
            })
            .catch(error => {
                alert(error.message);
            });
        }
    </script>
</body>
</html>
